name: Materialize DOTA Hero Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-dota-heroes.yml'
      - 'dota-blind-spot/assets/heroes-batch-02.part*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-hero-sprite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Decode and split hero artwork
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('dota-blind-spot')
          assets = root / 'assets'
          parts = sorted(assets.glob('heroes-batch-02.part*.b64'))
          if len(parts) != 6:
              raise RuntimeError(f'Expected 6 sprite parts, got {len(parts)}')

          payload = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          sprite_path = Path('/tmp/dota-heroes.webp')
          sprite_path.write_bytes(base64.b64decode(payload))

          hero_ids = [
              'juggernaut', 'storm-spirit', 'templar-assassin', 'tidehunter', 'sniper',
              'tiny', 'zeus', 'queen-of-pain', 'riki', 'antimage-alt',
              'sven', 'legion-commander', 'bloodseeker', 'mirana', 'kunkka',
              'viper', 'shadow-shaman', 'ogre-magi', 'terrorblade', 'enigma'
          ]

          sprite = Image.open(sprite_path).convert('RGB')
          cols, rows = 5, 4
          cell_w = sprite.width // cols
          cell_h = sprite.height // rows
          if cell_w <= 0 or cell_h <= 0:
              raise RuntimeError(f'Invalid sprite size: {sprite.size}')

          output_dir = assets / 'heroes-generated'
          output_dir.mkdir(parents=True, exist_ok=True)

          for index, hero_id in enumerate(hero_ids):
              col = index % cols
              row = index // cols
              left = col * cell_w
              top = row * cell_h
              right = sprite.width if col == cols - 1 else (col + 1) * cell_w
              bottom = sprite.height if row == rows - 1 else (row + 1) * cell_h
              crop = sprite.crop((left, top, right, bottom))
              crop.save(output_dir / f'{hero_id}.webp', 'WEBP', quality=86, method=6)

          manifest_path = assets / 'heroes.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          id_to_file = {hero_id.replace('-', '_'): hero_id for hero_id in hero_ids}
          id_to_file['antimage_alt'] = 'antimage-alt'

          changed = 0
          for hero in manifest:
              hero_id = hero.get('id')
              if hero_id in id_to_file:
                  hero.pop('spriteIndex', None)
                  hero['image'] = f"./assets/heroes-generated/{id_to_file[hero_id]}.webp"
                  changed += 1

          if changed != 20:
              raise RuntimeError(f'Expected to update 20 manifest rows, updated {changed}')

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          print(f'Sprite: {sprite.size}, each cell about {cell_w}x{cell_h}')
          print(f'Created {len(hero_ids)} individual images and updated {changed} manifest rows.')
          PY

      - name: Commit generated hero images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dota-blind-spot/assets/heroes-generated dota-blind-spot/assets/heroes.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: add 20 individual DOTA hero artwork files"
          git push
