name: Repair black DOTA final hero images

on:
  push:
    paths:
      - '.github/workflows/repair-black-final-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow requests numpy

      - name: Download recognizable hero artwork and validate every image
        run: |
          python - <<'PYCODE'
          import hashlib
          import json
          from io import BytesIO
          from pathlib import Path

          import numpy as np
          import requests
          from PIL import Image, ImageChops, ImageDraw, ImageEnhance, ImageFilter, ImageOps

          project = Path('dota-blind-spot')
          manifest_path = project / 'assets' / 'heroes.json'
          final_dir = project / 'assets' / 'heroes-generated' / 'final'
          final_dir.mkdir(parents=True, exist_ok=True)

          # 题库 ID -> DOTA 资源内部名。
          hero_names = {
              'abaddon': 'abaddon',
              'ancient-apparition': 'ancient_apparition',
              'bane': 'bane',
              'beastmaster': 'beastmaster',
              'bounty-hunter': 'bounty_hunter',
              'brewmaster': 'brewmaster',
              'broodmother': 'broodmother',
              'chaos-knight': 'chaos_knight',
              'clockwerk': 'rattletrap',
              'dark-seer': 'dark_seer',
              'dawnbreaker': 'dawnbreaker',
              'death-prophet': 'death_prophet',
              'doom': 'doom_bringer',
              'dragon-knight': 'dragon_knight',
              'earthshaker': 'earthshaker',
              'ember-spirit': 'ember_spirit',
              'faceless-void': 'faceless_void',
              'gyrocopter': 'gyrocopter',
              'keeper-of-the-light': 'keeper_of_the_light',
              'lich': 'lich',
              'lion': 'lion',
              'luna': 'luna',
              'mars': 'mars',
              'medusa': 'medusa',
              'monkey-king': 'monkey_king',
              'morphling': 'morphling',
              'naga-siren': 'naga_siren',
              'natures-prophet': 'furion',
              'night-stalker': 'night_stalker',
              'omniknight': 'omniknight',
              'oracle': 'oracle',
              'puck': 'puck',
              'pugna': 'pugna',
              'razor': 'razor',
              'rubick': 'rubick',
              'sand-king': 'sand_king',
              'slardar': 'slardar',
              'slark': 'slark',
              'spectre': 'spectre',
              'techies': 'techies',
              'timbersaw': 'shredder',
              'tinker': 'tinker',
              'treant-protector': 'treant',
              'tusk': 'tusk',
              'ursa': 'ursa',
              'warlock': 'warlock',
              'weaver': 'weaver',
              'witch-doctor': 'witch_doctor',
              'wraith-king': 'skeleton_king',
          }

          id_to_slug = {
              'lich': 'lich',
              'earthshaker': 'earthshaker',
              'puck': 'puck',
              'rubick': 'rubick',
              'faceless_void': 'faceless-void',
              'luna': 'luna',
              'slark': 'slark',
              'ember_spirit': 'ember-spirit',
              'monkey_king': 'monkey-king',
              'dawnbreaker': 'dawnbreaker',
              'mars': 'mars',
              'treant_protector': 'treant-protector',
              'naga_siren': 'naga-siren',
              'gyrocopter': 'gyrocopter',
              'timbersaw': 'timbersaw',
              'keeper_of_the_light': 'keeper-of-the-light',
              'bane': 'bane',
              'razor': 'razor',
              'warlock': 'warlock',
              'brewmaster': 'brewmaster',
              'beastmaster': 'beastmaster',
              'witch_doctor': 'witch-doctor',
              'doom': 'doom',
              'medusa': 'medusa',
              'wraith_king': 'wraith-king',
              'sand_king': 'sand-king',
              'clockwerk': 'clockwerk',
              'abaddon': 'abaddon',
              'tusk': 'tusk',
              'lion': 'lion',
              'tinker': 'tinker',
              'night_stalker': 'night-stalker',
              'spectre': 'spectre',
              'dragon_knight': 'dragon-knight',
              'pugna': 'pugna',
              'ursa': 'ursa',
              'weaver': 'weaver',
              'death_prophet': 'death-prophet',
              'bounty_hunter': 'bounty-hunter',
              'ancient_apparition': 'ancient-apparition',
              'chaos_knight': 'chaos-knight',
              'morphling': 'morphling',
              'dark_seer': 'dark-seer',
              'natures_prophet': 'natures-prophet',
              'broodmother': 'broodmother',
              'techies': 'techies',
              'oracle': 'oracle',
              'omniknight': 'omniknight',
              'slardar': 'slardar',
          }

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (compatible; dota-blind-spot-builder/1.0)',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })

          def source_urls(internal_name):
              return [
                  f'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/heroes/{internal_name}_vert.jpg',
                  f'https://cdn.dota2.com/apps/dota2/images/heroes/{internal_name}_vert.jpg',
                  f'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/{internal_name}.png',
                  f'https://cdn.akamai.steamstatic.com/apps/dota2/images/dota_react/heroes/{internal_name}.png',
              ]

          def download_image(internal_name):
              failures = []
              for url in source_urls(internal_name):
                  try:
                      response = session.get(url, timeout=25)
                      if response.status_code != 200:
                          failures.append(f'{response.status_code} {url}')
                          continue
                      if len(response.content) < 5000:
                          failures.append(f'small response {len(response.content)} {url}')
                          continue
                      with Image.open(BytesIO(response.content)) as opened:
                          image = opened.convert('RGB')
                      if image.width < 100 or image.height < 100:
                          failures.append(f'small dimensions {image.size} {url}')
                          continue
                      return image, url
                  except Exception as exc:
                      failures.append(f'{type(exc).__name__}: {exc} {url}')
              raise SystemExit(
                  'unable to download hero artwork for '
                  + internal_name
                  + '\n'
                  + '\n'.join(failures)
              )

          def fit_cover(image, size, centering=(0.5, 0.42)):
              return ImageOps.fit(
                  image,
                  size,
                  method=Image.Resampling.LANCZOS,
                  centering=centering,
              )

          def make_portrait(source, slug):
              width, height = 512, 768

              background = fit_cover(source, (width, height))
              background = background.filter(ImageFilter.GaussianBlur(30))
              background = ImageEnhance.Brightness(background).enhance(0.42)
              background = ImageEnhance.Color(background).enhance(1.28)

              # 中央立绘：竖图完整展示；横图适度裁边，确保英雄主体足够大。
              ratio = source.width / source.height
              if ratio <= 1.05:
                  foreground = ImageOps.contain(
                      source,
                      (470, 716),
                      method=Image.Resampling.LANCZOS,
                  )
              else:
                  foreground = fit_cover(source, (470, 640), centering=(0.5, 0.40))

              foreground = ImageOps.autocontrast(foreground, cutoff=0.35)
              foreground = ImageEnhance.Brightness(foreground).enhance(1.13)
              foreground = ImageEnhance.Contrast(foreground).enhance(1.08)
              foreground = ImageEnhance.Color(foreground).enhance(1.08)
              foreground = foreground.filter(
                  ImageFilter.UnsharpMask(radius=1.1, percent=115, threshold=3)
              )

              canvas = background.copy()
              x = (width - foreground.width) // 2
              y = max(18, (height - foreground.height) // 2 - 8)

              # 给立绘增加柔和阴影，避免暗部与背景融为一体。
              shadow_mask = Image.new('L', foreground.size, 235)
              shadow_mask = shadow_mask.filter(ImageFilter.GaussianBlur(18))
              shadow = Image.new('RGB', foreground.size, (0, 0, 0))
              canvas.paste(shadow, (x, y + 14), shadow_mask)
              canvas.paste(foreground, (x, y))

              # 轻微中心补光和暗角，保持暗黑风格但不允许整图漆黑。
              yy, xx = np.ogrid[:height, :width]
              cx, cy = width * 0.50, height * 0.43
              distance = ((xx - cx) / (width * 0.66)) ** 2 + ((yy - cy) / (height * 0.66)) ** 2
              center = np.clip(1.0 - distance, 0, 1) ** 1.7
              seed = int(hashlib.sha256(slug.encode()).hexdigest()[:8], 16)
              glow_color = np.array([
                  28 + seed % 22,
                  25 + (seed >> 7) % 24,
                  34 + (seed >> 13) % 30,
              ], dtype=np.float32)
              glow_array = np.clip(center[..., None] * glow_color, 0, 255).astype(np.uint8)
              canvas = ImageChops.screen(canvas, Image.fromarray(glow_array, 'RGB'))

              edge = np.clip(distance, 0, 1)
              alpha = np.clip((edge - 0.45) / 0.55, 0, 1) * 105
              vignette = Image.new('RGB', (width, height), (0, 0, 0))
              canvas = Image.composite(
                  vignette,
                  canvas,
                  Image.fromarray(alpha.astype(np.uint8), 'L'),
              )
              return canvas

          def metrics_for(image):
              gray = np.asarray(image.convert('L'))
              center = gray[
                  round(gray.shape[0] * 0.15):round(gray.shape[0] * 0.83),
                  round(gray.shape[1] * 0.14):round(gray.shape[1] * 0.86),
              ]
              return {
                  'mean': round(float(gray.mean()), 2),
                  'std': round(float(gray.std()), 2),
                  'p95': round(float(np.percentile(gray, 95)), 2),
                  'dark_ratio': round(float((gray < 12).mean()), 4),
                  'center_mean': round(float(center.mean()), 2),
                  'center_std': round(float(center.std()), 2),
                  'center_p90': round(float(np.percentile(center, 90)), 2),
              }

          heroes = json.loads(manifest_path.read_text(encoding='utf-8'))
          metrics = {}
          repaired = []

          for hero in heroes:
              slug = id_to_slug.get(hero['id'])
              if not slug:
                  continue
              internal_name = hero_names[slug]
              source, source_url = download_image(internal_name)
              image = make_portrait(source, slug)

              output_path = final_dir / f'{slug}.jpg'
              image.save(output_path, 'JPEG', quality=91, optimize=True, progressive=True)

              current = metrics_for(image)
              current.update({
                  'bytes': output_path.stat().st_size,
                  'sha256': hashlib.sha256(output_path.read_bytes()).hexdigest(),
                  'source_url': source_url,
                  'source_width': source.width,
                  'source_height': source.height,
              })
              metrics[slug] = current

              if current['mean'] < 42:
                  raise SystemExit(f'{slug}: whole image too dark: {current}')
              if current['center_mean'] < 48:
                  raise SystemExit(f'{slug}: hero center too dark: {current}')
              if current['center_std'] < 20:
                  raise SystemExit(f'{slug}: hero center lacks visible detail: {current}')
              if current['center_p90'] < 85:
                  raise SystemExit(f'{slug}: hero highlights too dark: {current}')
              if current['dark_ratio'] > 0.34:
                  raise SystemExit(f'{slug}: excessive black area: {current}')
              if current['bytes'] < 15000:
                  raise SystemExit(f'{slug}: output file unexpectedly small: {current}')

              hero['image'] = f'./assets/heroes-generated/final/{slug}.jpg?v=20260806-heroart7'
              repaired.append(slug)

          if len(repaired) != 49:
              raise SystemExit(f'expected 49 repaired hero images, got {len(repaired)}')

          ids = [hero['id'] for hero in heroes]
          names = [hero['name'] for hero in heroes]
          if len(ids) != len(set(ids)) or len(names) != len(set(names)):
              raise SystemExit('duplicate hero id or name')

          hashes = [metrics[slug]['sha256'] for slug in repaired]
          if len(hashes) != len(set(hashes)):
              raise SystemExit('duplicate final hero image byte content detected')

          for hero in heroes:
              relative = hero['image'].split('?', 1)[0].removeprefix('./')
              if not (project / relative).exists():
                  raise SystemExit(f'missing referenced image: {hero["image"]}')

          manifest_path.write_text(
              json.dumps(heroes, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (final_dir / 'validation.json').write_text(
              json.dumps(metrics, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          print('hero records:', len(heroes))
          print('recognizable hero images rebuilt:', len(repaired))
          print('minimum whole mean:', min(item['mean'] for item in metrics.values()))
          print('minimum center mean:', min(item['center_mean'] for item in metrics.values()))
          print('maximum dark ratio:', max(item['dark_ratio'] for item in metrics.values()))
          print('ursa:', json.dumps(metrics['ursa'], ensure_ascii=False))
          PYCODE

      - name: Commit repaired hero artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dota-blind-spot/assets/heroes.json \
                  dota-blind-spot/assets/heroes-generated/final
          git diff --cached --quiet || (
            git commit -m "fix: replace black placeholders with recognizable hero artwork" &&
            git push
          )
