name: Apply DOTA Demo Polish

on:
  push:
    paths:
      - '.github/workflows/apply-dota-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble polished page
        run: |
          cat .github/tmp/dota-polish/part*.txt > dota-blind-spot/index.html

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('dota-blind-spot/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>([\s\S]*?)</script>', html)
          if not match:
              raise SystemExit('script block missing')
          Path('/tmp/dota-script.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/dota-script.js

      - name: Commit polished demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dota-blind-spot/index.html
          git rm -r .github/tmp/dota-polish
          git rm .github/workflows/apply-dota-polish.yml
          git commit -m "feat: polish DOTA fog challenge experience"
          git push
