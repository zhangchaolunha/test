name: Apply DOTA Guessing UX v0.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dota-v06.yml'
      - 'dota-blind-spot/tools/polish_v06.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UX patch
        run: python dota-blind-spot/tools/polish_v06.py

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('dota-blind-spot/index.html').read_text(encoding='utf-8')
          script = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/dota-v06.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/dota-v06.js

      - name: Remove one-time patch files
        run: |
          rm -f dota-blind-spot/tools/polish_v06.py
          rm -f .github/workflows/apply-dota-v06.yml
          rmdir dota-blind-spot/tools 2>/dev/null || true

      - name: Commit polished page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add progressive clues expert input and local stats' || exit 0
          git push
