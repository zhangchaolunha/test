name: Remove DOTA Text Clues

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-dota-text-clues.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply visual-only patch
        run: python3 .github/scripts/remove_dota_clues.py

      - name: Validate JavaScript
        run: |
          python3 -c "from pathlib import Path; import re; t=Path('dota-blind-spot/index.html').read_text(encoding='utf-8'); s=re.findall(r'<script>(.*?)</script>', t, re.S); assert len(s)==1; Path('/tmp/dota-script.js').write_text(s[0], encoding='utf-8')"
          node --check /tmp/dota-script.js

      - name: Remove one-time files
        run: rm -f .github/workflows/remove-dota-text-clues.yml .github/scripts/remove_dota_clues.py

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dota-blind-spot/index.html .github/workflows/remove-dota-text-clues.yml .github/scripts/remove_dota_clues.py
          git commit -m "fix: keep DOTA challenge visual-only"
          git push
