<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b0d">
<title>战争迷雾 · DOTA 残图竞猜</title>
<style>
:root{--bg:#080a0c;--panel:#14181b;--panel2:#191d20;--line:rgba(255,255,255,.1);--text:#f3efe6;--muted:#8f989e;--red:#c53b2a;--gold:#d8b55e;--green:#75b984;--x:58%;--y:50%;--r:92px}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 10% 5%,rgba(135,40,28,.15),transparent 25%),linear-gradient(#0e1012,#060708);overflow-x:hidden}button{font:inherit}.app{width:min(1180px,calc(100% - 28px));margin:auto;padding:14px 0 38px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;transform:rotate(45deg);border:1px solid #8d2d21;background:linear-gradient(145deg,#9a3024,#3b100d);position:relative}.logo:before,.logo:after{content:"";position:absolute;background:#111416}.logo:before{width:7px;height:29px;left:15px;top:4px;transform:skew(-18deg)}.logo:after{height:7px;width:29px;left:4px;top:15px;transform:skew(-18deg)}.brand strong{font:700 22px Georgia,serif}.nav{display:flex;align-items:center;gap:7px}.nav button{border:1px solid transparent;background:transparent;color:#899399;padding:8px 13px;border-radius:8px;cursor:pointer}.nav .active{color:white;border-color:#7b2b23;background:rgba(139,38,28,.14)}.avatar{width:34px;height:34px;border-radius:50%;border:1px solid rgba(216,181,94,.4);display:grid;place-items:center;color:var(--gold)}
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding:30px 0 20px}.eyebrow{color:#ed5542;font-size:11px;font-weight:800;letter-spacing:.25em}.hero h1{font:700 clamp(38px,5vw,62px)/.92 Georgia,serif;margin:9px 0 10px;letter-spacing:-.04em}.hero p{margin:0;color:#94a0a7;font-size:13px;line-height:1.7;max-width:780px}.people{min-width:158px;padding:14px;border:1px solid rgba(216,181,94,.22);border-radius:10px;background:rgba(216,181,94,.045)}.people span{font-size:10px;color:#899399}.people b{display:block;color:var(--gold);font:700 25px Georgia,serif;margin-top:4px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.hud>div{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:linear-gradient(#1a1e21,#111416);min-height:72px}.hud span{display:block;color:#849097;font-size:10px;letter-spacing:.05em}.hud b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}.gold{color:var(--gold)}.red{color:#f05d49}
.game{display:grid;grid-template-columns:minmax(0,1.58fr) minmax(320px,.76fr);gap:14px}.card{border:1px solid var(--line);border-radius:14px;background:rgba(19,23,26,.94);box-shadow:0 25px 70px rgba(0,0,0,.42);overflow:hidden}.head{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.head h2{font-size:14px;margin:0}.bars{display:flex;gap:4px}.bars i{width:17px;height:4px;border-radius:5px;background:#343a3e}.bars .on{background:#ef5140;box-shadow:0 0 9px rgba(239,81,64,.35)}
.stage{height:492px;position:relative;overflow:hidden;background:#090c0e;isolation:isolate;cursor:crosshair}.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:1;filter:saturate(.9) contrast(1.08);transform:scale(1.01)}.hero-image.error{display:none}.fallback{position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 58% 45%,#3e5260,transparent 18%),linear-gradient(135deg,#101820,#18252d)}.fog{position:absolute;inset:0;z-index:3;background:radial-gradient(circle at var(--x) var(--y),transparent 0,transparent var(--r),rgba(4,6,7,.14) calc(var(--r) + 12px),rgba(5,7,8,.82) calc(var(--r) + 55px),rgba(5,7,8,.98) calc(var(--r) + 135px)),radial-gradient(ellipse at 15% 40%,rgba(129,142,148,.12),transparent 35%),radial-gradient(ellipse at 80% 70%,rgba(100,112,117,.1),transparent 35%),rgba(4,6,7,.75);transition:background .4s ease}.fog:before,.fog:after{content:"";position:absolute;inset:-15%;background:radial-gradient(circle at 20% 50%,rgba(143,153,157,.18),transparent 24%),radial-gradient(circle at 75% 25%,rgba(123,135,139,.13),transparent 25%);filter:blur(24px);animation:drift 12s ease-in-out infinite alternate;pointer-events:none}.fog:after{animation-duration:17s;animation-direction:alternate-reverse}@keyframes drift{from{transform:translate(-3%,2%) scale(1.05)}to{transform:translate(4%,-3%) scale(1.16)}}.scope{position:absolute;z-index:4;left:var(--x);top:var(--y);width:calc(var(--r)*2 + 16px);height:calc(var(--r)*2 + 16px);border:1px solid rgba(216,181,94,.3);border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset 0 0 32px rgba(216,181,94,.05);pointer-events:none;transition:.35s}.scope:before,.scope:after{content:"";position:absolute;background:rgba(216,181,94,.25)}.scope:before{width:1px;height:28px;left:50%;top:-14px}.scope:after{height:1px;width:28px;top:50%;left:-14px}.vision{position:absolute;z-index:5;left:16px;bottom:14px;display:flex;align-items:center;gap:10px;font-size:10px;color:#c8ced1}.vision b{color:var(--gold);font-size:22px}.foot{height:68px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#899399;font-size:11px}.dots{display:flex;gap:7px}.dots i{width:9px;height:9px;border:1px solid #657078;border-radius:50%}.dots .used{background:#e84e3c;border-color:#e84e3c}
.answer{padding:16px}.type{display:flex;align-items:center;gap:7px;color:#d4b568;font-size:10px;font-weight:700;letter-spacing:.08em}.type:before{content:"";width:6px;height:6px;background:var(--gold);border-radius:50%}.prompt{font:700 21px Georgia,serif;margin:10px 0 14px}.options{display:grid;gap:8px}.option{height:49px;padding:0 13px;border:1px solid rgba(255,255,255,.09);border-radius:9px;background:linear-gradient(rgba(255,255,255,.025),rgba(255,255,255,.01));color:#e1e4e5;display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:left;transition:.18s}.option:hover{border-color:rgba(216,181,94,.4);transform:translateY(-1px)}.option kbd{width:25px;height:25px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.08);border-radius:6px;color:#737d83;font-size:10px}.option.wrong{color:#ee8d80;border-color:#aa3b30;background:rgba(180,46,34,.11);animation:shake .25s}.option.correct{color:#a5deb0;border-color:#5e9f6b;background:rgba(80,150,94,.13)}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.hint{min-height:60px;margin-top:12px;padding:11px 12px;border:1px dashed rgba(216,181,94,.25);border-radius:9px;background:rgba(216,181,94,.035);color:#9ba4a9;font-size:11px;line-height:1.6}.hint b{color:#e1c36d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{height:44px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:#1a1e21;color:#dce0e1;cursor:pointer}.btn.primary{background:linear-gradient(#ae3325,#812219);border-color:#bd4032;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.legal{text-align:center;color:#5f696e;font-size:9px;padding-top:18px}
.toast{position:fixed;z-index:40;left:50%;bottom:28px;transform:translate(-50%,18px);padding:11px 15px;border:1px solid var(--line);border-radius:9px;background:#171b1e;color:#eee;font-size:12px;opacity:0;transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(2,3,4,.78);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.22s}.modal.show{opacity:1;pointer-events:auto}.result{width:min(560px,100%);overflow:hidden;border:1px solid rgba(216,181,94,.27);border-radius:16px;background:linear-gradient(#20252a,#101315);box-shadow:0 40px 120px #000}.result-img{height:270px;background-size:cover;background-position:center}.result-body{text-align:center;padding:20px 22px 22px}.result-kicker{color:var(--green);font-size:10px;letter-spacing:.18em}.result h3{font:700 36px Georgia,serif;margin:7px 0}.result p{color:#9aa3a8;font-size:12px;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:16px 0}.stats div{padding:10px;border-right:1px solid var(--line)}.stats div:last-child{border:0}.stats span{display:block;color:#737d83;font-size:9px}.stats b{display:block;margin-top:3px;font-size:18px}.final-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:330px;margin:13px auto}.final-grid span{height:40px;display:grid;place-items:center;border-radius:7px;border:1px solid rgba(117,185,132,.28);background:rgba(117,185,132,.11);color:#9bd0a6;font-weight:800}
@media(max-width:860px){.nav button:not(.active),.avatar{display:none}.hero{grid-template-columns:1fr}.people{width:max-content}.hud{grid-template-columns:repeat(2,1fr)}.game{grid-template-columns:1fr}.stage{height:430px}}@media(max-width:520px){.app{width:calc(100% - 18px)}.hero h1{font-size:42px}.stage{height:350px}.answer{padding:13px}.foot{height:62px}.result-img{height:220px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><div class="logo"></div><strong>战争迷雾</strong></div><nav class="nav"><button class="active">每日挑战</button><button>无尽模式</button><button>好友房</button><div class="avatar">先</div></nav></header>
<section class="hero"><div><div class="eyebrow">DAILY CHALLENGE · #001</div><h1>你真的认得<br>这些英雄吗？</h1><p>根据战争迷雾中残缺的画面判断英雄。猜错会扩大视野，但也会损失分数。点击画面还能移动一次侦察视野。</p></div><div class="people"><span>今日挑战人数</span><b>12,684</b></div></section>
<section class="hud"><div><span>题目进度</span><b id="progress">1 / 5</b></div><div><span>当前得分</span><b class="gold" id="score">1,000</b></div><div><span>连续答对</span><b id="streak">0</b></div><div><span>剩余时间</span><b class="red" id="timer">45s</b></div></section>
<section class="game">
<article class="card"><div class="head"><h2>战争迷雾视野</h2><div class="bars"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div></div><div class="stage" id="stage"><div class="fallback"></div><img class="hero-image" id="heroImage" alt="待猜测的英雄局部图"><div class="fog"></div><div class="scope"></div><div class="vision"><b id="vision">08%</b><span>当前可见视野<br>点击画面移动侦察点</span></div></div><div class="foot"><span>猜错一次，迷雾会自动消退一层</span><div class="dots" id="dots"></div></div></article>
<aside class="card"><div class="head"><h2>作出判断</h2><span id="attemptLabel" style="font-size:10px;color:#778188">第 1 次猜测</span></div><div class="answer"><div class="type">英雄辨识</div><div class="prompt">迷雾中是哪一位英雄？</div><div class="options" id="options"></div><div class="hint" id="hint"><b>先知提示：</b>暂未使用真视。越早答对，分数越高。</div><div class="actions"><button class="btn" id="hintBtn">使用真视 −120</button><button class="btn primary" id="skipBtn">放弃并揭晓</button></div></div></aside>
</section><div class="legal">非官方玩法概念 Demo。Dota、Dota 2 及相关商标归 Valve Corporation 所有。</div>
</main>
<div class="toast" id="toast"></div><div class="modal" id="modal"><div class="result"><div class="result-img" id="resultImg"></div><div class="result-body" id="resultBody"></div></div></div>
<script>
const questions=[
{answer:'卓尔游侠',image:'assets/drow-ranger.svg',hint:'敏捷型远程英雄，来自卓尔族，以冰霜箭矢和精准射击闻名。',roast:'至少你最终发现，她并不是敌法师。',options:['卓尔游侠','幻影刺客','米拉娜','露娜','风行者','圣堂刺客']},
{answer:'屠夫',image:'assets/pudge.svg',hint:'力量型近战英雄，最经典的技能是一根能把敌人拖过来的钩子。',roast:'这身材都没认出来，建议少在泉水挂机。',options:['屠夫','潮汐猎人','斧王','裂魂人','食人魔魔法师','孽主']},
{answer:'祈求者',image:'assets/invoker.svg',hint:'智力型远程英雄，能通过三种元素组合出大量技能。',roast:'十个技能很难记，但这张脸应该不难。',options:['祈求者','天怒法师','光之守卫','沉默术士','拉比克','术士']},
{answer:'敌法师',image:'assets/antimage.svg',hint:'敏捷型近战英雄，擅长闪烁切入，并且极其讨厌魔法。',roast:'你与正确答案之间，只差一次闪烁。',options:['敌法师','虚空假面','主宰','恐怖利刃','幻影长矛手','齐天大圣']},
{answer:'水晶室女',image:'assets/crystal-maiden.svg',hint:'智力型远程辅助，技能与冰霜有关，并能为全队提供魔法恢复。',roast:'她走得很慢，但你的答案来得更慢。',options:['水晶室女','莉娜','冰女','莉莱','魅惑魔女','寒冬飞龙'],aliases:['冰女','莉莱']}
];
const levels=[92,135,185,245,320,700],percents=['08%','16%','30%','55%','80%','100%'];let qi=0,attempt=0,total=0,current=1000,streak=0,seconds=45,timer,hintUsed=false,answered=false;const results=[];const $=id=>document.getElementById(id),root=document.documentElement;
function ok(q,n){return n===q.answer||(q.aliases||[]).includes(n)}function dots(){$('dots').innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<attempt?'used':''}"></i>`).join('')}
function load(){const q=questions[qi];attempt=0;current=1000;seconds=45;hintUsed=false;answered=false;root.style.setProperty('--r',levels[0]+'px');root.style.setProperty('--x',(qi%2?38:58)+'%');root.style.setProperty('--y',(qi%3?46:52)+'%');const img=$('heroImage');img.classList.remove('error');img.src=q.image;img.onerror=()=>{img.classList.add('error');$('hint').innerHTML='<b>素材异常：</b>本地图片加载失败，请强制刷新页面。'};$('progress').textContent=`${qi+1} / ${questions.length}`;$('score').textContent=current.toLocaleString();$('streak').textContent=streak;$('timer').textContent=seconds+'s';$('vision').textContent=percents[0];$('attemptLabel').textContent='第 1 次猜测';$('hint').innerHTML='<b>先知提示：</b>暂未使用真视。越早答对，分数越高。';$('hintBtn').disabled=false;$('skipBtn').disabled=false;dots();$('options').innerHTML=q.options.map((n,i)=>`<button class="option" data-name="${n}"><span>${n}</span><kbd>${i+1}</kbd></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>guess(b,b.dataset.name));clearInterval(timer);timer=setInterval(tick,1000)}
function tick(){if(answered)return;seconds--;current=Math.max(100,current-2);$('timer').textContent=seconds+'s';$('score').textContent=current.toLocaleString();if(seconds<=0)reveal(false,true)}
function guess(btn,name){if(answered||btn.classList.contains('wrong'))return;const q=questions[qi];if(ok(q,name)){btn.classList.add('correct');reveal(true,false);return}attempt++;current=Math.max(100,current-150);btn.classList.add('wrong');btn.disabled=true;const l=Math.min(attempt,5);root.style.setProperty('--r',levels[l]+'px');$('vision').textContent=percents[l];$('score').textContent=current.toLocaleString();$('attemptLabel').textContent=`第 ${Math.min(attempt+1,5)} 次猜测`;dots();toast(attempt>=4?'迷雾已经很薄了，再看一眼。':'回答错误，战争迷雾正在消退。');if(attempt>=5)setTimeout(()=>reveal(false,false),350)}
function useHint(){if(hintUsed||answered)return;hintUsed=true;current=Math.max(100,current-120);$('score').textContent=current.toLocaleString();$('hint').innerHTML=`<b>真视生效：</b>${questions[qi].hint}`;$('hintBtn').disabled=true;toast('真视已开启，本题扣除 120 分。')}
function reveal(correct,timeout){if(answered)return;answered=true;clearInterval(timer);const q=questions[qi];root.style.setProperty('--r',levels[5]+'px');$('vision').textContent='100%';if(correct){total+=current;streak++}else{current=0;streak=0}$('score').textContent=current.toLocaleString();$('streak').textContent=streak;results.push({correct,score:current});setTimeout(()=>result(q,correct,timeout),320)}
function result(q,correct,timeout){$('resultImg').style.backgroundImage=`url('${q.image}')`;const last=qi===questions.length-1;$('resultBody').innerHTML=`<div class="result-kicker">${correct?'VISION CONFIRMED · 识破迷雾':timeout?'TIME OUT · 视野消失':'FAILED · 云玩家警告'}</div><h3>${correct?q.answer:'答案：'+q.answer}</h3><p>${correct?q.roast:'你成功避开了正确答案。'+q.roast}</p><div class="stats"><div><span>本题得分</span><b>${current}</b></div><div><span>猜测次数</span><b>${correct?attempt+1:'—'}</b></div><div><span>可见视野</span><b>${percents[Math.min(attempt,5)]}</b></div></div><button class="btn primary" style="width:100%" id="next">${last?'查看今日战绩':'进入下一题'}</button>`;$('modal').classList.add('show');$('next').onclick=()=>{$('modal').classList.remove('show');if(last)final();else{qi++;setTimeout(load,180)}}}
function final(){const count=results.filter(x=>x.correct).length;$('resultImg').style.backgroundImage='linear-gradient(135deg,#85281f,#111518)';$('resultBody').innerHTML=`<div class="result-kicker">DAILY CHALLENGE COMPLETE</div><h3>今日视野评级</h3><div class="final-grid">${results.map(x=>`<span>${x.correct?'✓':'×'}</span>`).join('')}</div><p>答对 ${count}/${questions.length} 题，总得分 <b class="gold">${total.toLocaleString()}</b>。${count>=4?'先知已经看见了你的潜力。':'建议携带真视宝石重新进入战场。'}</p><button class="btn primary" style="width:100%" id="restart">再挑战一次</button>`;$('modal').classList.add('show');$('restart').onclick=()=>{qi=0;total=0;streak=0;results.length=0;$('modal').classList.remove('show');setTimeout(load,180)}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1700)}
$('stage').onpointerdown=e=>{if(answered)return;const r=$('stage').getBoundingClientRect();root.style.setProperty('--x',Math.max(15,Math.min(85,(e.clientX-r.left)/r.width*100))+'%');root.style.setProperty('--y',Math.max(15,Math.min(85,(e.clientY-r.top)/r.height*100))+'%');current=Math.max(100,current-30);$('score').textContent=current.toLocaleString();toast('侦察视野已移动，本题扣除 30 分。')};$('hintBtn').onclick=useHint;$('skipBtn').onclick=()=>reveal(false,false);document.onkeydown=e=>{const n=+e.key;if(n>=1&&n<=6&&!answered){const b=document.querySelectorAll('.option')[n-1];if(b)b.click()}};load();
</script>
</body></html>
